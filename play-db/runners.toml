# runners.toml - Runner version manifest for play
# Updated by maintainers when new GE-Proton releases are available
# Play NEVER fetches runner metadata from the internet at game launch time
#
# SHA512 checksums are in the .sha512sum files attached to each release
# To get real checksum: curl -sL <release_url>/<file>.sha512sum | cut -d' ' -f1

[[runners]]
runner_type = "ProtonCachyOS"
version = "11.0.0"
