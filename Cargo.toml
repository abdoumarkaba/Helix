[workspace]
members = ["crates/helix-cli", "crates/helix-core", "crates/helix-helper", "crates/helix-db-tools"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
