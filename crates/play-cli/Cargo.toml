[package]
name = "play-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "play"
path = "src/main.rs"

[dependencies]
play-core = { path = "../play-core" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console = "0.15"
indicatif = "0.17"
toml = "0.8"
dirs = "5.0"
tempfile = "3"
chrono = "0.4"
serde_json = "1.0"
