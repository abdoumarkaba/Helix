name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        container:
          - ubuntu:24.04
          - fedora:41
          - archlinux:latest
          # Mint is Ubuntu-based; test its package detection specifically
          - linuxmintd/mint22-amd64

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu/Mint)
        if: contains(matrix.container, 'ubuntu') || contains(matrix.container, 'mint')
        run: apt-get update && apt-get install -y curl build-essential pkg-config
      - name: Install dependencies (Fedora)
        if: contains(matrix.container, 'fedora')
        run: dnf install -y curl gcc pkg-config
      - name: Install dependencies (Arch)
        if: contains(matrix.container, 'archlinux')
        run: pacman -Sy --noconfirm curl base-devel
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Build
        run: ~/.cargo/bin/cargo build --all
      - name: Unit tests
        run: ~/.cargo/bin/cargo test --all
      - name: Integration detection smoke test
        run: ~/.cargo/bin/cargo run --bin play-detect-only
