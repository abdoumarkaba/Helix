name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        container:
          - ubuntu:24.04
          - fedora:41
          - archlinux:latest
          # Mint is Ubuntu-based; test its package detection specifically
          - linuxmintd/mint22-amd64

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Build
        run: cargo build --all
      - name: Unit tests
        run: cargo test --all
      - name: Integration detection smoke test
        run: cargo run --bin play-detect-only
