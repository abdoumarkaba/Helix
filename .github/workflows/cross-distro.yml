name: Cross-Distro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
            install: apt-get update && apt-get install -y curl build-essential pkg-config libssl-dev
          - distro: Fedora 39
            image: fedora:39
            install: dnf install -y curl gcc pkg-config openssl-devel
          - distro: Arch Linux
            image: archlinux:latest
            install: pacman -Syu --noconfirm --needed curl base-devel pkg-config openssl

    steps:
      - name: Install build dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --workspace

      - name: Test
        run: |
          . "$HOME/.cargo/env"
          cargo test --workspace
